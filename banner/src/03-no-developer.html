*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0a0b}
.stage{position:relative;width:2560px;height:1440px;overflow:hidden;background:#0a0a0b;
  font-family:'Geist',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
/* 64px grid, white .5 alpha at 8% - straight from AnimatedAppGrid */
.grid{position:absolute;inset:0;opacity:.08;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:64px 64px}
/* centre glow - orange-500 at 5%, heavy blur */
.cglow{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  width:1900px;height:1150px;border-radius:50%;background:rgba(249,115,22,.05);filter:blur(200px)}
.stars i{position:absolute;border-radius:50%;display:block}
.arc{position:absolute;inset:0;width:2560px;height:1440px}
/* fade the very bottom back into the ground */
.fade{position:absolute;left:0;right:0;bottom:0;height:340px;
  background:linear-gradient(to bottom,rgba(10,10,11,0),#0a0a0b)}
/* everything critical lives in the 1546x423 mobile-safe box */
.safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:1546px;height:423px;display:flex;flex-direction:column;
  justify-content:center;padding:26px 28px;z-index:5}
.badge{display:inline-flex;align-items:center;gap:10px;padding:9px 22px;border-radius:999px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);
  font-size:21px;font-weight:500;letter-spacing:.02em;color:rgba(255,255,255,.5);white-space:nowrap}
.badge b{width:9px;height:9px;border-radius:50%;background:#F97316;display:block}
h1{font-weight:700;letter-spacing:-.035em;line-height:1.06;color:#fff}
h1 em{font-style:normal;background:linear-gradient(90deg,#FB923C,#EA580C);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:rgba(255,255,255,.42);font-weight:400;letter-spacing:-.005em}
.stats{display:flex;align-items:center;gap:18px;font-size:25px;color:rgba(255,255,255,.42);white-space:nowrap}
.stats b{color:#fff;font-weight:600}
.stats s{text-decoration:none;color:rgba(255,255,255,.22)}
.url{font-family:'Geist Mono',monospace;font-size:23px;color:#F97316;letter-spacing:.01em;white-space:nowrap}
.tiles{display:flex;gap:16px}
.tile{flex:1;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);
  border-radius:14px;padding:16px 22px}
.tile u{display:block;text-decoration:none;font-size:40px;font-weight:700;color:#fff;letter-spacing:-.03em}
.tile s{display:block;text-decoration:none;font-size:20px;color:rgba(255,255,255,.38);margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between}
